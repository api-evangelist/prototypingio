aid: prototypingio
name: Prototyping.io
description: >-
  Prototyping.io is a Y Combinator (Spring 2026) startup building AI-driven
  autonomous manufacturing for mechanical parts. The platform converts CAD
  designs into finished physical parts by automating design-for-manufacturability
  analysis, manufacturability evaluation, production planning, machine execution,
  and quality control across CNC machining, sheet metal, 3D printing, injection
  molding, extrusion, and die casting. Founded by Revanth Bodepudi (CEO) and
  Prerit Oberai (CTO) in the San Francisco Bay Area, it targets hardware teams in
  robotics, AI infrastructure, energy, automotive, and defense, aiming to cut
  hardware iteration cycles from weeks to days with no minimum order quantities
  and tight tolerances. The company is in early-access/waitlist stage and does
  not yet publish a public API, developer portal, SDK, or documentation surface.
